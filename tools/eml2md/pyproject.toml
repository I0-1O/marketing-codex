[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "eml2md"
version = "0.1.0"
description = "Convert EML email files to clean Markdown with YAML frontmatter"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "markdownify>=0.11",
    "PyYAML>=6.0",
]

[project.scripts]
eml2md = "eml2md:main"
